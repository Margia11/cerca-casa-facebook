<title>Cerca casa</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: lista di schede annuncio in una colonna, barra di riepilogo e filtri in alto */
:root {
  --bg: #f6f5f2;
  --surface: #ffffff;
  --fg: #23211d;
  --muted: #6e6a62;
  --line: #e2dfd8;
  --accent: #b5401f;          
  --accent-soft: #f6e4dd;
  --ok: #2f7a4a;  --ok-soft: #e0f0e5;
  --warn: #9a6a00; --warn-soft: #f7ecd2;
  --bad: #a3312b; --bad-soft: #f6dedc;
  --info: #2b5c9a; --info-soft: #dfe8f5;
  --map-bg: #eeece6;
  --metro-a: #e4572e; --metro-b: #1f62b5; --metro-c: #2a9a4a;
  --font-display: "Barlow Condensed", "Arial Narrow", sans-serif;
  --font-body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #171614; --surface: #211f1c; --fg: #ece8e1; --muted: #a39d93; --line: #35322d;
    --accent: #e8714c; --accent-soft: #3a241b;
    --ok: #6cc28c; --ok-soft: #1d3326; --warn: #e0b04a; --warn-soft: #362c14;
    --bad: #ec7d76; --bad-soft: #3b1f1d; --info: #82aee6; --info-soft: #1c2a3d;
    --map-bg: #1c1b18;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #171614; --surface: #211f1c; --fg: #ece8e1; --muted: #a39d93; --line: #35322d;
  --accent: #e8714c; --accent-soft: #3a241b;
  --ok: #6cc28c; --ok-soft: #1d3326; --warn: #e0b04a; --warn-soft: #362c14;
  --bad: #ec7d76; --bad-soft: #3b1f1d; --info: #82aee6; --info-soft: #1c2a3d;
  --map-bg: #1c1b18;
  color-scheme: dark;
}
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: 15px; line-height: 1.5;
}
.wrap {
  max-width: 760px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 48px;
  display: flex; flex-direction: column; gap: 18px;
}
header { display: flex; flex-direction: column; gap: 4px; }
h1 {
  font-family: var(--font-display); font-weight: 700; font-size: 2.2rem;
  letter-spacing: .01em; line-height: 1.05; margin: 0; text-wrap: balance;
}
.sub { color: var(--muted); font-size: .92rem; }
.sub b { color: var(--fg); font-weight: 600; }

.counts { display: flex; flex-wrap: wrap; gap: 8px; }
.count {
  display: flex; align-items: baseline; gap: 6px;
  padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line);
  background: var(--surface); font-size: .88rem; color: var(--muted);
}
.count strong { font-family: var(--font-mono); font-size: .95rem; color: var(--fg); font-variant-numeric: tabular-nums; }
.count.hot strong { color: var(--accent); }

.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tab {
  appearance: none; border: 0; background: none; cursor: pointer;
  font: 600 1rem var(--font-display); letter-spacing: .04em; text-transform: uppercase;
  color: var(--muted); padding: 8px 12px; border-bottom: 3px solid transparent; white-space: nowrap;
}
.tab[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); }
.tab:focus-visible, .btn:focus-visible, select:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.tab .n { font-family: var(--font-mono); font-size: .8rem; margin-left: 4px; }

.list { display: flex; flex-direction: column; gap: 12px; }
.card {
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
  padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; min-width: 0;
}
.card.is-new { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
.card.dim { opacity: .62; }
.top { display: flex; gap: 10px; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; }
.title { font-weight: 600; font-size: 1.05rem; line-height: 1.3; min-width: 0; flex: 1 1 260px; }
.price { font-family: var(--font-mono); font-size: 1rem; white-space: nowrap; }
.price small { display: block; font-size: .75rem; color: var(--muted); text-align: right; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.tag {
  font-size: .78rem; font-weight: 600; letter-spacing: .03em;
  padding: 2px 8px; border-radius: 4px; background: var(--bg); color: var(--muted); border: 1px solid var(--line);
}
.tag.new { background: var(--accent-soft); color: var(--accent); border-color: transparent; text-transform: uppercase; }
.metro {
  display: inline-flex; align-items: center; justify-content: center;
  width: 20px; height: 20px; border-radius: 4px; color: #fff;
  font: 700 .8rem var(--font-display);
}
.metro.a { background: var(--metro-a); } .metro.b { background: var(--metro-b); } .metro.c { background: var(--metro-c); }
.zone { display: inline-flex; gap: 6px; align-items: center; font-size: .9rem; }
.details { color: var(--fg); font-size: .92rem; }
.note { color: var(--muted); font-size: .9rem; border-left: 2px solid var(--line); padding-left: 10px; }
.foot { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; font-size: .85rem; color: var(--muted); }
.foot a { color: var(--accent); font-weight: 600; text-decoration: none; }
.foot a:hover { text-decoration: underline; }
.score { font-family: var(--font-mono); }
.state { display: flex; align-items: center; gap: 6px; }
select {
  font: 500 .88rem var(--font-body); color: var(--fg); background: var(--surface);
  border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px;
}
.pill { font-size: .78rem; font-weight: 600; padding: 2px 8px; border-radius: 999px; }
.s-nuovo { background: var(--accent-soft); color: var(--accent); }
.s-contattare { background: var(--info-soft); color: var(--info); }
.s-scritto { background: var(--warn-soft); color: var(--warn); }
.s-visita { background: var(--ok-soft); color: var(--ok); }
.s-offerta { background: var(--accent-soft); color: var(--accent); }
.s-scartato, .s-affittato, .s-venduto { background: var(--bad-soft); color: var(--bad); }

.empty {
  border: 1px dashed var(--line); border-radius: 10px; padding: 28px 20px; text-align: center; color: var(--muted);
  display: flex; flex-direction: column; gap: 6px;
}
.empty strong { color: var(--fg); font-family: var(--font-display); font-size: 1.25rem; letter-spacing: .02em; }
.notice { font-size: .85rem; color: var(--muted); }

.flag { font-size: .85rem; border-radius: 6px; padding: 6px 10px; display: flex; gap: 8px; align-items: baseline; }
.flag b { font-weight: 600; }
.flag.warn { background: var(--bad-soft); color: var(--bad); }
.flag.price { background: var(--bg); color: var(--muted); border: 1px solid var(--line); }
.flag.price.low { color: var(--ok); }
.flag.price.high { color: var(--warn); }
/* Mappa: disegnata in SVG senza tile esterne; posizioni indicative */
.mapbox { display: flex; flex-direction: column; gap: 10px; }
.maptools { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; justify-content: space-between; font-size: .85rem; color: var(--muted); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.dot { width: 11px; height: 11px; border-radius: 50%; display: inline-block; border: 2px solid var(--surface); box-shadow: 0 0 0 1px var(--line); }
.dot.shortlist { background: var(--accent); } .dot.quasi { background: var(--warn); } .dot.sospetto { background: var(--bad); } .dot.archivio { background: var(--muted); }
.dot.lavoro { background: var(--fg); border-radius: 2px; }
.mapframe { position: relative; border: 1px solid var(--line); border-radius: 10px; background: var(--map-bg); overflow: hidden; touch-action: none; }
.mapframe svg { display: block; width: 100%; height: clamp(340px, 62vh, 560px); cursor: grab; user-select: none; }
.mapframe svg.dragging { cursor: grabbing; }
.zoom { position: absolute; right: 10px; top: 10px; display: flex; flex-direction: column; gap: 4px; }
.zoom button, .btn {
  appearance: none; border: 1px solid var(--line); background: var(--surface); color: var(--fg);
  font: 600 1rem var(--font-body); border-radius: 6px; min-width: 34px; height: 34px; cursor: pointer; padding: 0 10px;
}
.zoom button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mapnote { position: absolute; left: 10px; bottom: 10px; right: 56px; font-size: .78rem; color: var(--muted); }
.mapempty { position: absolute; inset: auto 12px 12px 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; font-size: .88rem; color: var(--muted); }
.mapempty strong { color: var(--fg); }
.chk { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
.m-pin { cursor: pointer; }
.m-pin:focus-visible circle.hit { stroke: var(--fg); stroke-width: 2; }
.m-label { font: 500 11px var(--font-body); fill: var(--muted); paint-order: stroke; stroke: var(--map-bg); stroke-width: 3px; stroke-linejoin: round; }
.m-zone { font: 700 12px var(--font-display); letter-spacing: .06em; text-transform: uppercase; fill: var(--fg); paint-order: stroke; stroke: var(--map-bg); stroke-width: 3px; }
.m-time { font: 500 10px var(--font-mono); fill: var(--fg); paint-order: stroke; stroke: var(--map-bg); stroke-width: 3px; }
.prices { display: flex; flex-direction: column; gap: 18px; }
.prices h2 { font: 700 1.15rem var(--font-display); letter-spacing: .03em; text-transform: uppercase; margin: 0 0 6px; }
.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: .9rem; }
th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { font-weight: 600; color: var(--muted); font-size: .8rem; letter-spacing: .04em; text-transform: uppercase; }
tr:last-child td { border-bottom: 0; }
td.num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; text-align: right; }
th.num { text-align: right; }
.bar { position: relative; height: 6px; background: var(--bg); border-radius: 3px; min-width: 80px; }
.bar span { position: absolute; top: 0; height: 6px; border-radius: 3px; background: var(--accent-soft); }
.bar i { position: absolute; top: -2px; width: 2px; height: 10px; background: var(--accent); }
.hint { color: var(--muted); font-size: .88rem; }
@media (prefers-reduced-motion: no-preference) { .card { transition: opacity .2s; } }
</style>

<div class="wrap">
  <header>
    <h1 id="titolo">Cerca casa</h1>
    <div class="sub" id="sub">Gli annunci trovati nei gruppi Facebook compaiono qui dopo ogni ricerca.</div>
  </header>

  <div class="counts" id="counts" aria-live="polite"></div>

  <div class="tabs" role="tablist" id="tabs">
    <button class="tab" role="tab" id="tab-shortlist" data-tab="shortlist" aria-selected="true">Da valutare</button>
    <button class="tab" role="tab" id="tab-quasi" data-tab="quasi" aria-selected="false">Quasi</button>
    <button class="tab" role="tab" id="tab-sospetto" data-tab="sospetto" aria-selected="false">Sospetti</button>
    <button class="tab" role="tab" id="tab-archivio" data-tab="archivio" aria-selected="false">Archivio</button>
    <button class="tab" role="tab" id="tab-mappa" data-tab="mappa" aria-selected="false">Mappa</button>
    <button class="tab" role="tab" id="tab-prezzi" data-tab="prezzi" aria-selected="false">Prezzi</button>
  </div>

  <div class="list" id="list">
    <div class="empty">
      <strong>Caricamento degli annunci…</strong>
      <span>Qui compaiono gli annunci trovati da ogni ricerca nei gruppi Facebook.</span>
    </div>
  </div>

  <div class="notice" id="notice"></div>
</div>

<script>
const STATI_AFFITTO = [
  ["nuovo", "Nuovo"],
  ["contattare", "Da contattare"],
  ["scritto", "Scritto"],
  ["visita", "Visita fissata"],
  ["scartato", "Scartato"],
  ["affittato", "Già affittato"],
];
const STATI_ACQUISTO = [
  ["nuovo", "Nuovo"],
  ["contattare", "Da contattare"],
  ["scritto", "Scritto"],
  ["visita", "Visita fissata"],
  ["offerta", "Proposta fatta"],
  ["scartato", "Scartato"],
  ["venduto", "Già venduto"],
];
let STATI = STATI_AFFITTO;
const ARCHIVIO = new Set(["scartato", "affittato", "venduto"]);
const isAcquisto = () => meta.modo === "acquisto";
let tab = "shortlist";
let rows = [];
let meta = {};
let voci = [];
const GIORNI_PREZZI = 60;
let canWrite = true;

try { const t = localStorage.getItem("tab"); if (t) tab = t; } catch (e) {}

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function fmtDate(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  if (isNaN(d)) return esc(iso);
  return d.toLocaleString("it-IT", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
}
function metroPills(m) {
  if (!m) return "";
  return String(m).split(/[,\s]+/).filter(Boolean).map((l) => {
    const k = l.toLowerCase();
    return ["a", "b", "c"].includes(k) ? `<span class="metro ${k}" title="Metro ${k.toUpperCase()}">${k.toUpperCase()}</span>` : "";
  }).join("");
}

const eur = (n) => Number(n).toLocaleString("it-IT");
function median(a) {
  const s = [...a].sort((x, y) => x - y);
  const m = Math.floor(s.length / 2);
  return s.length % 2 ? s[m] : Math.round((s[m - 1] + s[m]) / 2);
}
function renderPrezzi() {
  const limite = new Date(Date.now() - GIORNI_PREZZI * 864e5).toISOString().slice(0, 10);
  const acq = isAcquisto();
  const val = (v) => (acq && typeof v.m === "number" && v.m > 0 ? Math.round(v.p / v.m) : acq ? null : v.p);
  const recenti = voci.filter((v) => v && typeof v.p === "number" && v.t && (v.d || "") >= limite && (!v.c || v.c === (acq ? "vendita" : "affitto")) && val(v) != null);
  if (!recenti.length) {
    $("#list").innerHTML = `<div class="empty"><strong>Ancora nessun prezzo</strong><span>A ogni ricerca vengono registrati i prezzi di tutte le offerte lette, anche quelle fuori dai tuoi criteri. Dopo qualche giorno qui trovi il prezzo tipico per zona e tipologia.</span></div>`;
    return;
  }
  const perTipo = {};
  for (const v of recenti) {
    const t = v.t, z = v.q || v.z || "Altro";
    ((perTipo[t] ||= {})[z] ||= []).push(val(v));
  }
  const tipi = Object.keys(perTipo).sort((a, b) =>
    Object.values(perTipo[b]).flat().length - Object.values(perTipo[a]).flat().length);
  const u = acq ? " €/m²" : " €";
  const blocks = tipi.map((t) => {
    const zone = Object.entries(perTipo[t]).map(([z, ps]) => ({ z, n: ps.length, med: median(ps), min: Math.min(...ps), max: Math.max(...ps) }));
    const tutti = Object.values(perTipo[t]).flat();
    const gmin = Math.min(...tutti), gmax = Math.max(...tutti), span = Math.max(1, gmax - gmin);
    zone.sort((a, b) => b.n - a.n || a.z.localeCompare(b.z));
    const righe = zone.map((r) => {
      const l = ((r.min - gmin) / span) * 100, w = Math.max(2, ((r.max - r.min) / span) * 100), m = ((r.med - gmin) / span) * 100;
      return `<tr><td>${esc(r.z)}</td><td class="num">${r.n}</td><td class="num">${eur(r.med)}${u}</td><td class="num">${eur(r.min)}–${eur(r.max)}${u}</td>
        <td><div class="bar" aria-hidden="true"><span style="left:${l}%;width:${w}%"></span><i style="left:calc(${m}% - 1px)"></i></div></td></tr>`;
    }).join("");
    return `<section><h2>${esc(t)} · mediana ${eur(median(tutti))}${u}</h2>
      <div class="tablewrap"><table><thead><tr><th>Zona</th><th class="num">Annunci</th><th class="num">Mediana</th><th class="num">Da–a</th><th>Distribuzione</th></tr></thead><tbody>${righe}</tbody></table></div></section>`;
  }).join("");
  $("#list").innerHTML = `<div class="prices"><p class="hint">${acq ? "Prezzo al metro quadro delle case in vendita" : "Prezzi mensili delle offerte"} lette negli ultimi ${GIORNI_PREZZI} giorni (${recenti.length} annunci), anche fuori dai tuoi criteri. Con meno di 4 annunci in una zona il valore è solo indicativo.</p>${blocks}</div>`;
}

// ---------- Mappa ----------
// Proiezione equirettangolare locale; nessuna tile esterna (il frame non carica immagini da altri siti).
let mapView = null;            // { cx, cy, span } in coordinate proiettate
let mapSel = null;             // id dell'annuncio selezionato
let mapDrag = null;            // trascinamento in corso
let mapArchivio = false;
try { mapArchivio = localStorage.getItem("mapArchivio") === "1"; } catch (e) {}
const LINE_TOKENS = { a: "var(--metro-a)", b: "var(--metro-b)", c: "var(--metro-c)" };
const CAT_COLOR = { shortlist: "var(--accent)", quasi: "var(--warn)", sospetto: "var(--bad)" };
const num = (v) => (typeof v === "number" && isFinite(v) ? v : null);

function mapFeatures() {
  const linee = Array.isArray(meta.linee) ? meta.linee : [];
  const zone = Array.isArray(meta.zone) ? meta.zone : [];
  const lav = meta.lavoro && num(meta.lavoro.lat) != null && num(meta.lavoro.lon) != null ? meta.lavoro : null;
  const pins = rows.filter((r) => num(r.lat) != null && num(r.lon) != null)
    .filter((r) => mapArchivio || !ARCHIVIO.has(r.stato || "nuovo"));
  return { linee, zone, lav, pins };
}
function mapProject(lat0) {
  const k = Math.cos((lat0 * Math.PI) / 180);
  return (lat, lon) => [lon * k, -lat];
}
function renderMappa() {
  const { linee, zone, lav, pins } = mapFeatures();
  const allLat = [], allLon = [];
  linee.forEach((l) => (l.fermate || []).forEach((f) => { allLat.push(f[1]); allLon.push(f[2]); }));
  zone.forEach((z) => { allLat.push(z.lat); allLon.push(z.lon); });
  pins.forEach((r) => { allLat.push(r.lat); allLon.push(r.lon); });
  if (lav) { allLat.push(lav.lat); allLon.push(lav.lon); }
  const conDati = rows.filter((r) => num(r.lat) != null).length;

  const legend = `<div class="legend">
      <span><i class="dot shortlist"></i>Da valutare</span><span><i class="dot quasi"></i>Quasi</span>
      <span><i class="dot sospetto"></i>Sospetti</span>${mapArchivio ? '<span><i class="dot archivio"></i>Archivio</span>' : ""}
      ${lav ? `<span><i class="dot lavoro"></i>${esc(lav.nome || "Lavoro")}</span>` : ""}
    </div>
    <label class="chk" for="map-arch"><input type="checkbox" id="map-arch"${mapArchivio ? " checked" : ""}> Mostra anche scartati e affittati</label>`;

  if (!allLat.length) {
    $("#list").innerHTML = `<div class="mapbox"><div class="maptools">${legend}</div>
      <div class="empty"><strong>Mappa ancora vuota</strong><span>Dalla prossima ricerca ogni annuncio viene salvato con la sua posizione e compare qui, insieme alle linee della metro e alle tue zone.</span></div></div>`;
    bindMapTools();
    return;
  }
  const lat0 = allLat.reduce((a, b) => a + b, 0) / allLat.length;
  const P = mapProject(lat0);
  const pts = allLat.map((la, i) => P(la, allLon[i]));
  const xs = pts.map((p) => p[0]), ys = pts.map((p) => p[1]);
  const minX = Math.min(...xs), maxX = Math.max(...xs), minY = Math.min(...ys), maxY = Math.max(...ys);
  const home = { cx: (minX + maxX) / 2, cy: (minY + maxY) / 2, span: Math.max(maxX - minX, maxY - minY, 0.01) * 1.15 };
  if (!mapView || mapView.lat0 !== Math.round(lat0 * 100)) mapView = { ...home, lat0: Math.round(lat0 * 100) };

  const sel = rows.find((r) => r._id === mapSel && num(r.lat) != null);
  $("#list").innerHTML = `<div class="mapbox">
      <div class="maptools">${legend}</div>
      <div class="mapframe">
        <svg id="mapsvg" role="img" aria-label="Mappa degli annunci con le linee della metro e le zone preferite"></svg>
        <div class="zoom">
          <button type="button" id="zin" aria-label="Avvicina">+</button>
          <button type="button" id="zout" aria-label="Allontana">−</button>
          <button type="button" id="zhome" aria-label="Mostra tutto">⤢</button>
        </div>
        <div class="mapnote">Posizioni indicative${conDati < rows.length ? ` · ${rows.length - conDati} annunci senza posizione` : ""}</div>
      </div>
      <div id="mapcard">${sel ? mapCard(sel) : `<p class="hint">Tocca un punto per vedere l'annuncio.</p>`}</div>
    </div>`;
  bindMapTools();
  drawMap(P, home, { linee, zone, lav, pins });
}
function mapCard(r) {
  const st = r.stato || "nuovo";
  return `<article class="card${ARCHIVIO.has(st) ? " dim" : ""}">
    <div class="top"><div class="title">${esc(r.titolo || r.tipologia || "Annuncio")}</div>
      <div class="price">${esc(r.prezzo_testo || (r.prezzo ? eur(r.prezzo) + " €" : "prezzo ?"))}</div></div>
    <div class="tags"><span class="zone">${metroPills(r.metro)}<span>${esc(r.zona || "")}</span></span>
      ${r.tempo_lavoro != null ? `<span class="tag">${esc(meta.lavoro?.nome || "Lavoro")}: ${esc(r.tempo_lavoro)} min</span>` : ""}
      <span class="pill s-${st}">${STATI.find((s) => s[0] === st)?.[1] || st}</span></div>
    ${r.posizione ? `<div class="note">Posizione: ${esc(r.posizione)}</div>` : ""}
    <div class="foot">${r.link ? `<a href="${esc(r.link)}" target="_blank" rel="noopener">Apri il post</a>` : `<span>${esc(r.gruppo || "")}</span>`}</div>
  </article>`;
}
function drawMap(P, home, F) {
  const svg = document.getElementById("mapsvg");
  if (!svg) return;
  const W = svg.clientWidth || 600, H = svg.clientHeight || 420;
  const scale = Math.min(W, H) / mapView.span;
  const zoomLv = home.span / mapView.span;
  const T = (lat, lon) => { const [x, y] = P(lat, lon); return [(x - mapView.cx) * scale + W / 2, (y - mapView.cy) * scale + H / 2]; };
  const out = [];
  // zone preferite: cerchi tenui con nome
  F.zone.forEach((z) => {
    const [x, y] = T(z.lat, z.lon);
    const rpx = Math.max(14, ((z.r_m || 700) / 111320) * scale);
    out.push(`<circle cx="${x}" cy="${y}" r="${rpx}" fill="var(--accent-soft)" fill-opacity=".55" stroke="var(--accent)" stroke-opacity=".35" stroke-dasharray="4 4"/>`);
    out.push(`<text class="m-zone" x="${x}" y="${y - rpx - 4}" text-anchor="middle">${esc(z.nome)}</text>`);
  });
  // linee metro
  F.linee.forEach((l) => {
    const col = LINE_TOKENS[String(l.nome || "").toLowerCase()] || esc(l.colore || "var(--info)");
    const pts = (l.fermate || []).map((f) => T(f[1], f[2]));
    if (pts.length > 1) out.push(`<polyline points="${pts.map((p) => p.join(",")).join(" ")}" fill="none" stroke="${col}" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity=".85"/>`);
    (l.fermate || []).forEach((f, i) => {
      const [x, y] = pts[i];
      out.push(`<circle cx="${x}" cy="${y}" r="3.5" fill="var(--surface)" stroke="${col}" stroke-width="2"><title>${esc(f[0])} (${esc(l.nome)})</title></circle>`);
      if (zoomLv >= 1.8) out.push(`<text class="m-label" x="${x + 6}" y="${y + 4}">${esc(f[0])}</text>`);
    });
  });
  // lavoro
  if (F.lav) {
    const [x, y] = T(F.lav.lat, F.lav.lon);
    out.push(`<rect x="${x - 7}" y="${y - 7}" width="14" height="14" rx="2" fill="var(--fg)" stroke="var(--surface)" stroke-width="2"><title>${esc(F.lav.nome || "Lavoro")}</title></rect>`);
    out.push(`<text class="m-zone" x="${x + 11}" y="${y + 4}">${esc(F.lav.nome || "Lavoro")}</text>`);
  }
  // annunci (il selezionato per ultimo, sopra gli altri)
  const pins = [...F.pins].sort((a, b) => (a._id === mapSel) - (b._id === mapSel));
  pins.forEach((r) => {
    const [x, y] = T(r.lat, r.lon);
    const st = r.stato || "nuovo";
    const col = ARCHIVIO.has(st) ? "var(--muted)" : CAT_COLOR[r.categoria || "shortlist"] || "var(--accent)";
    const on = r._id === mapSel;
    const label = `${r.titolo || r.tipologia || "Annuncio"} · ${r.prezzo_testo || (r.prezzo ? r.prezzo + " €" : "")}`;
    out.push(`<g class="m-pin" tabindex="0" role="button" data-id="${esc(r._id)}" aria-label="${esc(label)}">
      <circle class="hit" cx="${x}" cy="${y}" r="${on ? 11 : 8}" fill="${col}" stroke="var(--surface)" stroke-width="${st === "nuovo" ? 3 : 2}"/>
      ${String(r.posizione || "").startsWith("approssimativa") ? `<circle cx="${x}" cy="${y}" r="${on ? 15 : 12}" fill="none" stroke="${col}" stroke-dasharray="2 3"/>` : ""}
      ${r.tempo_lavoro != null && (on || zoomLv >= 1.4) ? `<text class="m-time" x="${x}" y="${y - 13}" text-anchor="middle">${esc(r.tempo_lavoro)}′</text>` : ""}
      <title>${esc(label)}</title></g>`);
  });
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  svg.innerHTML = out.join("");
  const pick = (id) => { mapSel = id; renderMappa(); document.querySelector(`.m-pin[data-id="${CSS.escape(id)}"]`)?.focus({ preventScroll: true }); };
  svg.querySelectorAll(".m-pin").forEach((g) => {
    g.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); pick(g.dataset.id); } });
  });
  // trascinamento (sposta la mappa) e tocco su un punto (apre l'annuncio)
  svg.onpointerdown = (e) => {
    mapDrag = { x: e.clientX, y: e.clientY, cx: mapView.cx, cy: mapView.cy, pin: e.target.closest(".m-pin")?.dataset.id, moved: false };
    svg.setPointerCapture(e.pointerId);
  };
  svg.onpointermove = (e) => {
    if (!mapDrag) return;
    const dx = e.clientX - mapDrag.x, dy = e.clientY - mapDrag.y;
    if (!mapDrag.moved && Math.abs(dx) + Math.abs(dy) < 5) return;
    mapDrag.moved = true; svg.classList.add("dragging");
    mapView.cx = mapDrag.cx - dx / scale; mapView.cy = mapDrag.cy - dy / scale;
    drawMap(P, home, F);
  };
  svg.onpointerup = () => {
    const d = mapDrag; mapDrag = null; svg.classList.remove("dragging");
    if (d && !d.moved && d.pin) pick(d.pin);
  };
  svg.onpointercancel = () => { mapDrag = null; svg.classList.remove("dragging"); };
  svg.onwheel = (e) => { e.preventDefault(); zoomBy(e.deltaY < 0 ? 1.25 : 0.8, P, home, F); };
  document.getElementById("zin").onclick = () => zoomBy(1.5, P, home, F);
  document.getElementById("zout").onclick = () => zoomBy(1 / 1.5, P, home, F);
  document.getElementById("zhome").onclick = () => { Object.assign(mapView, { cx: home.cx, cy: home.cy, span: home.span }); drawMap(P, home, F); };
}
function zoomBy(f, P, home, F) {
  mapView.span = Math.min(home.span * 2, Math.max(home.span / 12, mapView.span / f));
  drawMap(P, home, F);
}
function bindMapTools() {
  const c = document.getElementById("map-arch");
  if (c) c.onchange = () => { mapArchivio = c.checked; try { localStorage.setItem("mapArchivio", mapArchivio ? "1" : "0"); } catch (e) {} renderMappa(); };
}
window.addEventListener("resize", () => { if (tab === "mappa") renderMappa(); });

// in acquisto la mediana è al metro quadro quando c'è la superficie
function cmpClass(r) {
  if (!r.prezzo || !r.mediana_zona) return "";
  const v = isAcquisto() && r.mq && r.mediana_zona < 50000 ? r.prezzo / r.mq : r.prezzo;
  return v < r.mediana_zona * 0.95 ? " low" : v > r.mediana_zona * 1.05 ? " high" : "";
}
function inTab(r) {
  const st = r.stato || "nuovo";
  if (tab === "archivio") return ARCHIVIO.has(st);
  if (ARCHIVIO.has(st)) return false;
  return (r.categoria || "shortlist") === tab;
}

function render() {
  document.querySelectorAll(".tab").forEach((b) => {
    const t = b.dataset.tab;
    b.setAttribute("aria-selected", String(t === tab));
    if (t === "prezzi" || t === "mappa") return;
    const n = rows.filter((r) => {
      const st = r.stato || "nuovo";
      if (t === "archivio") return ARCHIVIO.has(st);
      return !ARCHIVIO.has(st) && (r.categoria || "shortlist") === t;
    }).length;
    b.innerHTML = b.textContent.replace(/\s*\d+$/, "") + ` <span class="n">${n}</span>`;
  });

  const active = rows.filter((r) => !ARCHIVIO.has(r.stato || "nuovo") && (r.categoria || "shortlist") === "shortlist");
  const c = (st) => active.filter((r) => (r.stato || "nuovo") === st).length;
  $("#counts").innerHTML = [
    ["Nuovi", c("nuovo"), true],
    ["Da contattare", c("contattare")],
    ["Scritto", c("scritto")],
    ["Visite", c("visita")],
    ...(isAcquisto() ? [["Proposte", c("offerta")]] : []),
  ].map(([l, n, hot]) => `<span class="count${hot && n ? " hot" : ""}"><strong>${n}</strong>${l}</span>`).join("");

  const sub = [];
  if (meta.ultima_ricerca) sub.push(`Ultima ricerca <b>${fmtDate(meta.ultima_ricerca)}</b>`);
  if (meta.gruppi_letti != null) sub.push(`${meta.gruppi_letti} gruppi`);
  if (meta.post_letti != null) sub.push(`${meta.post_letti} post letti`);
  $("#sub").innerHTML = sub.length ? sub.join(" · ") : esc(meta.criteri || "Gli annunci trovati nei gruppi Facebook compaiono qui dopo ogni ricerca.");
  if (meta.titolo) { $("#titolo").textContent = meta.titolo; document.title = meta.titolo; }

  STATI = isAcquisto() ? STATI_ACQUISTO : STATI_AFFITTO;
  if (tab === "prezzi") { renderPrezzi(); return; }
  if (tab === "mappa") { renderMappa(); return; }

  const list = rows.filter(inTab).sort((a, b) => {
    const na = (a.stato || "nuovo") === "nuovo", nb = (b.stato || "nuovo") === "nuovo";
    if (na !== nb) return na ? -1 : 1;
    return (b.punteggio ?? 0) - (a.punteggio ?? 0) || String(b.trovato_il || "").localeCompare(String(a.trovato_il || ""));
  });

  if (!list.length) {
    const msg = {
      shortlist: ["Nessun annuncio da valutare", "Quando una ricerca trova un annuncio compatibile, compare qui con lo stato Nuovo."],
      quasi: ["Nessun annuncio quasi giusto", "Qui finiscono gli annunci a cui manca un solo criterio, per esempio 30 € sopra budget."],
      sospetto: ["Nessun annuncio sospetto", "Gli annunci con segnali di truffa vengono messi qui, con il motivo."],
      archivio: ["Archivio vuoto", `Gli annunci che segni come Scartato o ${isAcquisto() ? "Già venduto" : "Già affittato"} si spostano qui e non vengono più riproposti.`],
    }[tab];
    $("#list").innerHTML = `<div class="empty"><strong>${msg[0]}</strong><span>${msg[1]}</span></div>`;
    return;
  }

  $("#list").innerHTML = list.map((r) => {
    const st = r.stato || "nuovo";
    const opts = STATI.map(([v, l]) => `<option value="${v}"${v === st ? " selected" : ""}>${l}</option>`).join("");
    const links = (r.link ? [r.link] : []).concat(r.altri_link || []);
    const linkHtml = links.length
      ? links.map((u, i) => `<a href="${esc(u)}" target="_blank" rel="noopener">${i ? "Altro gruppo" : "Apri il post"}</a>`).join(" · ")
      : `<span>${esc([r.gruppo, r.autore].filter(Boolean).join(" · "))}</span>`;
    return `<article class="card${st === "nuovo" && r.categoria !== "sospetto" ? " is-new" : ""}${ARCHIVIO.has(st) ? " dim" : ""}" data-id="${esc(r._id)}">
      <div class="top">
        <div class="title">${esc(r.titolo || r.tipologia || "Annuncio")}</div>
        <div class="price">${esc(r.prezzo_testo || (r.prezzo ? eur(r.prezzo) + " €" : "prezzo ?"))}${r.prezzo && r.mq && isAcquisto() ? `<small>${eur(Math.round(r.prezzo / r.mq))} €/m²</small>` : ""}</div>
      </div>
      <div class="tags">
        ${st === "nuovo" ? '<span class="tag new">Nuovo</span>' : ""}
        <span class="zone">${metroPills(r.metro)}<span>${esc(r.zona || "zona da verificare")}</span></span>
        ${r.tipologia ? `<span class="tag">${esc(r.tipologia)}</span>` : ""}
        ${r.tempo_lavoro != null ? `<span class="tag">${esc(meta.lavoro?.nome || "Lavoro")}: ${esc(r.tempo_lavoro)} min</span>` : ""}
        ${r.mq ? `<span class="tag">${esc(r.mq)} m²</span>` : ""}
        ${r.bagni ? `<span class="tag">Bagni: ${esc(r.bagni)}</span>` : ""}
        ${r.disponibile_da ? `<span class="tag">${isAcquisto() ? "Disponibile" : "Libera"}: ${esc(r.disponibile_da)}</span>` : ""}
        ${r.durata ? `<span class="tag">Contratto: ${esc(r.durata)}</span>` : ""}
        ${r.proprietario ? `<span class="tag">Proprietario: ${esc(r.proprietario)}</span>` : ""}
      </div>
      ${r.dettagli ? `<div class="details">${esc(r.dettagli)}</div>` : ""}
      ${r.ripubblicato ? `<div class="flag warn"><b>Ripubblicato</b><span>${esc(r.ripubblicato)}</span></div>` : ""}
      ${r.confronto_prezzo ? `<div class="flag price${cmpClass(r)}"><b>Prezzo</b><span>${esc(r.confronto_prezzo)}</span></div>` : ""}
      ${r.note ? `<div class="note">${esc(r.note)}</div>` : ""}
      <div class="foot">
        <span>${linkHtml}</span>
        <span>Trovato ${fmtDate(r.trovato_il)}${r.punteggio != null ? ` · <span class="score">${r.punteggio} pt</span>` : ""}</span>
      </div>
      <div class="foot">
        <label class="state" for="s-${esc(r._id)}">Stato
          <select id="s-${esc(r._id)}" data-id="${esc(r._id)}"${canWrite ? "" : " disabled"}>${opts}</select>
        </label>
        <span class="pill s-${st}">${STATI.find((s) => s[0] === st)?.[1] || st}</span>
      </div>
    </article>`;
  }).join("");
}

document.getElementById("tabs").addEventListener("click", (e) => {
  const b = e.target.closest(".tab");
  if (!b) return;
  tab = b.dataset.tab;
  try { localStorage.setItem("tab", tab); } catch (err) {}
  render();
});

let db = null;
document.getElementById("list").addEventListener("change", async (e) => {
  const sel = e.target.closest("select[data-id]");
  if (!sel || !db) return;
  const id = sel.dataset.id;
  sel.disabled = true;
  try {
    await db.collection("annunci").doc(id).update({ stato: sel.value, aggiornato_il: new Date().toISOString() });
  } catch (err) {
    if (err && err.code === "invalid_argument") { canWrite = false; }
    $("#notice").textContent = "Non sono riuscito a salvare lo stato. Riprova tra poco.";
  } finally {
    sel.disabled = !canWrite;
  }
});

(async () => {
  db = await window.claude?.use?.("db");
  if (!db) {
    $("#list").innerHTML = `<div class="empty"><strong>Annunci non disponibili qui</strong><span>Apri la pagina dall'app di Claude con il tuo account per vedere e aggiornare gli annunci.</span></div>`;
    return;
  }
  try {
    const user = await window.claude.use("user");
    const w = user ? await user.can("data.write") : null;
    if (w === false) canWrite = false;
  } catch (e) {}

  db.collection("annunci").onSnapshot((snap) => {
    rows = snap.docs.map((d) => ({ _id: d.id, ...d.data() }));
    render();
  }, () => {
    $("#notice").textContent = "La lista non si aggiorna più in tempo reale: ricarica la pagina.";
  });
  db.collection("prezzi").onSnapshot((snap) => {
    voci = snap.docs.flatMap((d) => (Array.isArray(d.data().voci) ? d.data().voci : []));
    if (tab === "prezzi") render();
  }, () => {});
  db.doc("memoria/stato").onSnapshot((d) => {
    meta = d.exists ? d.data() : {};
    render();
  }, () => {});
})();
</script>
